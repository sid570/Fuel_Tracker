<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B27" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LPG Savings">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>LPG Savings Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F4; --surface:#FFFFFF; --ink:#13263A; --muted:#5A6B7C; --line:#D3DDE5;
  --lpg:#1F6FB2; --petrol:#B87A0B; --save:#1E8A4C; --danger:#B3261E;
  --display-bg:#0E1C12; --display-ink:#7CFFA0;
  --tabbar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1B27; --surface:#172636; --ink:#E6EDF3; --muted:#9AAABA; --line:#2A3C4F;
    --lpg:#5AA8EC; --petrol:#E8B44A; --save:#4FCB80; --danger:#FF8A80;
    --display-bg:#06100A; --display-ink:#7CFFA0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 48px}
header h1{font:700 1.9rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:8px 0 2px}
.vehbtn{background:none;border:0;padding:4px 0;margin:0;font:inherit;color:var(--muted);cursor:pointer;text-align:left;
  text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* pump readout */
.pump{margin:16px 0;background:var(--display-bg);border-radius:14px;padding:16px 18px;
  border:3px solid #2B3A2F;box-shadow:inset 0 0 24px rgba(0,0,0,.6)}
.pump .lbl{color:#8FB89A;font-size:.85rem}
.pump .big{font:700 clamp(2.4rem,11vw,3.6rem)/1.05 "Barlow Condensed",sans-serif;
  color:var(--display-ink);text-shadow:0 0 12px rgba(124,255,160,.45);letter-spacing:.02em;word-break:break-word}
.pump .big.loss{color:#FF9C8F;text-shadow:0 0 12px rgba(255,120,100,.45)}
.pump .row{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:4px 28px;margin-top:10px;color:#BFE8CB;font-size:.85rem}
.pump .row b{display:block;color:var(--display-ink);font-weight:600;font-size:1.05rem}

/* desktop menu */
nav.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
nav.menu button{font:600 .95rem "Barlow",sans-serif;padding:10px;border-radius:10px;min-height:56px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
nav.menu button .n{display:block;font-size:.75rem;color:var(--muted);font-weight:500}
nav.menu button[aria-current="true"]{border-color:var(--lpg);box-shadow:0 0 0 1px var(--lpg)}

/* phone tab bar */
nav.tabs{display:none}
@media (max-width:640px){
  nav.menu{display:none}
  .wrap{padding:12px 14px calc(var(--tabbar-h) + 32px)}
  header h1{font-size:1.6rem}
  nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--surface);border-top:1px solid var(--line);padding:0 2px env(safe-area-inset-bottom,0px)}
  nav.tabs button{background:none;border:0;color:var(--muted);font:600 .7rem/1.1 "Barlow",sans-serif;
    height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
  nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  nav.tabs button[aria-current="true"]{color:var(--lpg)}
  section{padding:16px 14px}
  .btn{width:100%}
}

section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
section+section{margin-top:14px}
section h2{font:700 1.35rem "Barlow Condensed",sans-serif;margin:0 0 8px}
section h3{font:700 1.1rem "Barlow Condensed",sans-serif;margin:18px 0 6px}
label{display:block;font-weight:600;margin:14px 0 6px}
.hint{color:var(--muted);font-size:.85rem;font-weight:400}
input,select{width:100%;font:500 16px/1.3 "Barlow",sans-serif;padding:12px 14px;min-height:50px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);appearance:none}
input.big{font-size:1.5rem;font-weight:600;min-height:58px}
input:focus,button:focus-visible,select:focus{outline:3px solid var(--lpg);outline-offset:1px}
.btn{font:600 1rem "Barlow",sans-serif;padding:13px 20px;min-height:50px;border-radius:10px;border:0;cursor:pointer;
  background:var(--lpg);color:#fff;margin-top:16px}
.btn.gas{background:var(--petrol);color:#1b1205}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{font:600 .95rem "Barlow",sans-serif;padding:8px 16px;min-height:40px;border-radius:20px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--lpg);color:var(--lpg)}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{font:600 .95rem "Barlow",sans-serif;padding:9px 18px;min-height:42px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-current="true"]{background:var(--lpg);color:#fff}

.report{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
.report.flat{border:0;padding:0;margin:0}
.report table{width:100%;border-collapse:collapse}
.report td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.report td:last-child{text-align:right;font-weight:600;padding-left:12px;white-space:nowrap}
.report tr.key td{font-size:1.15rem}
.report tr.sub td:first-child{padding-left:12px;color:var(--muted)}
.lpg{color:var(--lpg)} .petrol{color:var(--petrol)} .save{color:var(--save)} .neg{color:var(--danger)}

/* history */
.tablewrap{overflow-x:auto}
.hist{width:100%;border-collapse:collapse}
.hist th,.hist td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:.92rem}
.hist th:first-child,.hist td:first-child,.hist td.type,.hist th.type{text-align:left}
.hist th{color:var(--muted);font-weight:600}
.cards{display:none;list-style:none;margin:0;padding:0}
.cards li{border:1px solid var(--line);border-left:4px solid var(--lpg);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.cards li.refill{border-left-color:var(--petrol)}
.cards .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cards .saved{font:700 1.4rem "Barlow Condensed",sans-serif}
.cards .meta{color:var(--muted);font-size:.9rem}
.cards dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0 0}
.cards dt{color:var(--muted);font-size:.8rem}
.cards dd{margin:0;font-weight:600}
@media (max-width:640px){.tablewrap{display:none}.cards{display:block}}
.del{background:none;border:0;color:var(--danger);cursor:pointer;font:600 .9rem "Barlow",sans-serif;padding:8px 0;min-height:40px}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 8px;border-radius:10px;border:1px solid currentColor}

/* monthly */
.months{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
@media (max-width:640px){.months{grid-template-columns:1fr}}
.month{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.month .head{display:flex;justify-content:space-between;align-items:baseline}
.month .name{font-weight:700}
.month .net{font:700 1.5rem "Barlow Condensed",sans-serif}
.month table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:6px}
.month td{padding:4px 0;border-bottom:1px solid var(--line)}
.month td:last-child{text-align:right;font-weight:600}
.month tr:last-child td{border-bottom:0}

/* charts */
.chart{max-width:600px;margin:4px 0 6px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font:500 11px "Barlow",sans-serif}
.chart .val{font:600 10px "Barlow",sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* "more" list */
.list{list-style:none;margin:0;padding:0}
.list button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:none;border:0;border-bottom:1px solid var(--line);padding:16px 2px;min-height:60px;
  font:600 1.02rem "Barlow",sans-serif;color:var(--ink);cursor:pointer;text-align:left}
.list li:last-child button{border-bottom:0}
.list .sub{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.list .chev{color:var(--muted);font-size:1.3rem}
.back{background:none;border:0;color:var(--lpg);font:600 .95rem "Barlow",sans-serif;padding:6px 0 10px;cursor:pointer;display:none}
@media (max-width:640px){.back{display:inline-block}}

.empty{color:var(--muted)}
.syncline{font-size:.85rem;color:var(--muted);margin-top:14px;text-align:center}
.linkbtn{background:none;border:0;color:var(--lpg);font:inherit;cursor:pointer;text-decoration:underline;padding:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
  max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;
  font-size:.95rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:640px){.toast{bottom:calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:no-preference){.report{animation:in .25s ease-out}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
code{font-size:.9em}
.pumpopen{display:block;margin-top:12px;padding:8px 12px;border-radius:8px;border:1px solid #2F5A3A;background:rgba(124,255,160,.08);
  color:#BFE8CB;font:500 .9rem "Barlow",sans-serif;text-align:left;cursor:pointer;width:100%}
.pumpopen b{color:var(--display-ink)}
.opencyl{border:1.5px solid var(--lpg);border-radius:12px;padding:14px 16px;margin:4px 0 6px;background:var(--bg)}
.opencyl .t{font:700 1.25rem "Barlow Condensed",sans-serif}
.opencyl .d{color:var(--muted);font-size:.92rem}
.steps{display:flex;gap:8px;margin:2px 0 10px;font-size:.85rem;color:var(--muted)}
.steps span{padding:3px 10px;border-radius:12px;border:1px solid var(--line)}
.steps span.on{border-color:var(--lpg);color:var(--lpg);font-weight:600}
.cards li.inuse{border-left-style:dashed}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LPG vs Gasoline</h1>
    <button class="vehbtn" id="vehicle" aria-label="Edit vehicle"></button>
  </header>

  <div class="pump" aria-live="polite">
    <div class="lbl" id="pumpLbl">Net saved with LPG</div>
    <div class="big" id="pumpTotal">Rs 0.00</div>
    <div class="row">
      <span>Distance<b id="pumpKm">0 km</b></span>
      <span>LPG spent<b id="pumpLpg">Rs 0</b></span>
      <span>Gasoline refills<b id="pumpGas">Rs 0</b></span>
    </div>
    <button class="pumpopen" id="pumpOpen" data-view="entry" hidden></button>
  </div>

  <nav class="menu" aria-label="Main menu">
    <button data-view="entry"><span class="n">1</span>LPG cylinder</button>
    <button data-view="refill"><span class="n">2</span>Gasoline refill</button>
    <button data-view="summary"><span class="n">3</span>Savings summary</button>
    <button data-view="monthly"><span class="n">4</span>Monthly summary</button>
    <button data-view="history"><span class="n">5</span>Fuel history</button>
    <button data-view="prices"><span class="n">6</span>Update fuel prices</button>
    <button data-view="vehicle"><span class="n">7</span>Update vehicle</button>
    <button data-view="reset"><span class="n">8</span>Reset tracking</button>
  </nav>

  <main id="view"></main>

  <p class="syncline"><span id="syncState">Saved on this device.</span>
    <button class="linkbtn" data-view="storage">Storage &amp; sync</button></p>
</div>

<nav class="tabs" aria-label="Main menu">
  <button data-view="entry"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>LPG</button>
  <button data-view="refill"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg>Gas refill</button>
  <button data-view="summary"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Summary</button>
  <button data-view="history"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>History</button>
  <button data-view="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>
const DEFAULTS = {vehicleName:"Honda Fit GK3", vehicleYear:"2015", vehicleEngine:"L13B",
                  kmPerL:14, cylKg:12, lpgPrice:250, gasPrice:77.70};
const LS_DATA = "lpgTracker.data", LS_GH = "lpgTracker.github";
const MORE_VIEWS = ["prices","vehicle","reset","storage"];
const SUMMARY_VIEWS = ["summary","monthly"];
let state = load();
let gh = loadGh();
let current = "entry";
let histFilter = "all";

function normalise(d){
  const c = {...DEFAULTS, ...(d.config||{})};
  if(d.config && d.config.vehicle && !d.config.vehicleName && d.config.vehicle !== "Honda Fit GK3 2015 (L13B)"){
    c.vehicleName = d.config.vehicle; c.vehicleYear = ""; c.vehicleEngine = "";
  }
  delete c.vehicle;
  return {config:c, entries:Array.isArray(d.entries)?d.entries:[], refills:Array.isArray(d.refills)?d.refills:[], open:d.open||null};
}
function load(){
  try{ const d = JSON.parse(localStorage.getItem(LS_DATA)); if(d && d.config) return normalise(d); }catch(e){}
  return {config:{...DEFAULTS}, entries:[], refills:[], open:null};
}
function loadGh(){ try{ return JSON.parse(localStorage.getItem(LS_GH)) || null; }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LS_DATA, JSON.stringify(state)); }catch(e){} }

const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs = n => (n<0?"−":"") + "Rs " + Math.abs(n).toLocaleString("en-MU",{minimumFractionDigits:2,maximumFractionDigits:2});
const rs0 = n => (n<0?"−":"") + "Rs " + Math.abs(n).toLocaleString("en-MU",{maximumFractionDigits:0});
const num = (n,d=2) => n.toLocaleString("en-MU",{maximumFractionDigits:d});
const cls = n => n>=0 ? "save" : "neg";
const fmtDT = iso => new Date(iso).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const monthKey = iso => { const d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const monthName = (k,short) => new Date(+k.slice(0,4), +k.slice(5)-1, 1).toLocaleDateString("en-GB",short?{month:"short"}:{month:"long",year:"numeric"});
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function readDT(id){ const v=$(id).value; const d=v?new Date(v):new Date(); return isNaN(d)?new Date().toISOString():d.toISOString(); }
function daysBetween(a,b){ return Math.max(0,(new Date(b)-new Date(a))/86400000); }
function durText(a,b){ const d=daysBetween(a,b); if(d<1){ const h=Math.round(d*24); return h<1?"less than an hour":h+" hour"+(h===1?"":"s"); }
  const n=Math.round(d*10)/10; return num(n,1)+" day"+(n===1?"":"s"); }
function vehicleLabel(c=state.config){
  return [c.vehicleName, c.vehicleYear].filter(Boolean).join(" ") + (c.vehicleEngine ? ` (${c.vehicleEngine})` : "");
}

/* ---------- calculations ---------- */
function calc(e){
  const lpgCost = e.cyl * e.lpgPrice;
  const litres = e.km / e.kmPerL;
  const gasCost = litres * e.gasPrice;
  const savings = gasCost - lpgCost;
  return { lpgCost, litres, gasCost, savings,
    pct: gasCost ? savings / gasCost * 100 : 0,
    lpgPerKm: e.km ? lpgCost / e.km : 0,
    gasPerKm: e.km ? gasCost / e.km : 0,
    kmPerCyl: e.cyl ? e.km / e.cyl : 0 };
}
function blank(){ return {km:0,cyl:0,lpg:0,gas:0,gross:0,litres:0,refill:0,refillL:0,nRefill:0,nEntry:0}; }
function addEntry(t,e){ const c=calc(e); t.km+=e.km; t.cyl+=e.cyl; t.lpg+=c.lpgCost; t.gas+=c.gasCost; t.gross+=c.savings; t.litres+=c.litres; t.nEntry++; }
function addRefill(t,r){ t.refill+=r.amount; t.refillL+=r.amount/r.gasPrice; t.nRefill++; }
function finish(t){
  t.actual = t.lpg + t.refill;          // what you really paid
  t.net = t.gas - t.actual;             // vs running on gasoline only
  t.pct = t.gas ? t.net / t.gas * 100 : 0;
  return t;
}
function totals(){
  const t = blank(); state.entries.forEach(e=>addEntry(t,e)); state.refills.forEach(r=>addRefill(t,r)); return finish(t);
}
function monthly(){
  const m = {};
  const get = k => m[k] || (m[k] = Object.assign(blank(), {key:k}));
  state.entries.forEach(e=>addEntry(get(monthKey(e.date)), e));
  state.refills.forEach(r=>addRefill(get(monthKey(r.date)), r));
  return Object.values(m).map(finish).sort((a,b)=>a.key.localeCompare(b.key));
}

function refreshPump(){
  const t = totals();
  $("#pumpTotal").textContent = rs(t.net);
  $("#pumpTotal").classList.toggle("loss", t.net < 0);
  $("#pumpLbl").textContent = t.net < 0 ? "Net loss so far" : "Net saved with LPG";
  $("#pumpKm").textContent = num(t.km,1) + " km";
  $("#pumpLpg").textContent = rs0(t.lpg);
  $("#pumpGas").textContent = rs0(t.refill);
  const o = state.open, po = $("#pumpOpen");
  po.hidden = !o;
  if(o) po.innerHTML = `Cylinder in use for <b>${durText(o.startDate,new Date().toISOString())}</b>. Tap to finish it.`;
  $("#vehicle").textContent = `${vehicleLabel()}, ${num(state.config.kmPerL,1)} km/L`;
  document.title = "LPG Savings – " + (state.config.vehicleName || "My car");
}

function reportTable(e){
  const c = calc(e);
  return `<table>
    <tr class="key"><td>LPG savings on this trip</td><td class="${cls(c.savings)}">${rs(c.savings)}</td></tr>
    <tr><td>Savings percentage</td><td class="${cls(c.savings)}">${num(c.pct,1)}%</td></tr>
    <tr><td>LPG expense</td><td class="lpg">${rs(c.lpgCost)}</td></tr>
    <tr><td>Equivalent gasoline expense</td><td class="petrol">${rs(c.gasCost)}</td></tr>
    <tr><td>Equivalent gasoline</td><td>${num(c.litres)} L</td></tr>
    <tr><td>Cost per km on LPG</td><td class="lpg">${rs(c.lpgPerKm)}</td></tr>
    <tr><td>Cost per km on gasoline</td><td class="petrol">${rs(c.gasPerKm)}</td></tr>
    <tr><td>Distance per cylinder</td><td>${num(c.kmPerCyl,1)} km</td></tr>
  </table>`;
}
const back = () => `<button class="back" data-view="more">‹ More</button>`;
const seg = active => `<div class="seg" role="tablist">
  <button data-view="summary" aria-current="${active==='summary'}">Overall</button>
  <button data-view="monthly" aria-current="${active==='monthly'}">Monthly</button></div>`;

/* ---------- charts (inline SVG, no libraries) ---------- */
function chartNet(ms){
  const W=400,H=200,L=46,R=8,T=14,B=26, pw=W-L-R, ph=H-T-B, n=ms.length;
  const vals=ms.map(m=>m.net), hi=Math.max(0,...vals), lo=Math.min(0,...vals), span=(hi-lo)||1;
  const y=v=>T+(hi-v)/span*ph, slot=pw/n, bw=Math.min(36,slot*.62);
  let s=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  [hi,0,lo].filter((v,i,a)=>a.indexOf(v)===i).forEach(v=>s+=`<text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${rs0(v).replace("Rs ","")}</text>`);
  ms.forEach((m,i)=>{
    const x=L+slot*i+(slot-bw)/2, top=Math.min(y(m.net),y(0)), h=Math.max(1,Math.abs(y(m.net)-y(0)));
    s+=`<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="3" fill="var(${m.net>=0?'--save':'--danger'})"><title>${monthName(m.key)}: ${rs(m.net)}</title></rect>`;
    s+=`<text class="ax" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${monthName(m.key,true)}</text>`;
    if(n<=6) s+=`<text class="val" x="${x+bw/2}" y="${m.net>=0?top-4:top+h+11}" text-anchor="middle" fill="var(${m.net>=0?'--save':'--danger'})">${rs0(m.net).replace("Rs ","")}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net savings by month">${s}</svg></div>`;
}
function chartSpend(ms){
  const W=400,H=200,L=46,R=8,T=10,B=26, pw=W-L-R, ph=H-T-B, n=ms.length;
  const hi=Math.max(1,...ms.map(m=>Math.max(m.actual,m.gas)));
  const y=v=>T+(1-v/hi)*ph, slot=pw/n, bw=Math.min(16,slot*.32);
  let s=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  [hi,hi/2].forEach(v=>s+=`<text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${rs0(v).replace("Rs ","")}</text>
    <line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/>`);
  ms.forEach((m,i)=>{
    const x=L+slot*i+(slot-2*bw-3)/2;
    const hL=ph*m.lpg/hi, hR=ph*m.refill/hi, hG=ph*m.gas/hi;
    s+=`<rect x="${x}" y="${y(0)-hL}" width="${bw}" height="${hL}" fill="var(--lpg)"><title>LPG ${rs(m.lpg)}</title></rect>`;
    s+=`<rect x="${x}" y="${y(0)-hL-hR}" width="${bw}" height="${hR}" fill="var(--petrol)"><title>Gasoline refills ${rs(m.refill)}</title></rect>`;
    s+=`<rect x="${x+bw+3}" y="${y(0)-hG}" width="${bw}" height="${hG}" fill="var(--muted)" opacity=".45"><title>Gasoline only ${rs(m.gas)}</title></rect>`;
    s+=`<text class="ax" x="${x+bw+1.5}" y="${H-8}" text-anchor="middle">${monthName(m.key,true)}</text>`;
  });
  return `<div class="legend"><span><i style="background:var(--lpg)"></i>LPG</span><span><i style="background:var(--petrol)"></i>Gasoline refills</span>
    <span><i style="background:var(--muted);opacity:.45"></i>Cost on gasoline only</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly spending compared">${s}</svg></div>`;
}

function show(name, msg){
  current = name;
  const tab = MORE_VIEWS.includes(name) ? "more" : (SUMMARY_VIEWS.includes(name) ? "summary" : (name==="manual" ? "entry" : name));
  const navName = name==="manual" ? "entry" : name;
  document.querySelectorAll("nav.menu button").forEach(b=>b.setAttribute("aria-current", b.dataset.view===navName));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.view===tab));
  $("#view").innerHTML = views[name]();
  bind[name] && bind[name]();
  refreshPump();
  if(msg) toast(msg);
  window.scrollTo({top:0});
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-view]"); if(b) show(b.dataset.view);
  const f = e.target.closest("[data-filter]"); if(f){ histFilter = f.dataset.filter; show("history"); }
});
$("#vehicle").addEventListener("click", ()=>show("vehicle"));

const pick = () => ({lpgPrice:state.config.lpgPrice, gasPrice:state.config.gasPrice, kmPerL:state.config.kmPerL, vehicle:vehicleLabel()});
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const desktop = () => window.matchMedia("(min-width:641px)").matches;

const bind = {
  entry(){
    const o = state.open;
    if(!o){
      const sc = $("#sCyl"), cost = $("#sCost");
      const upd = () => { const v=parseFloat(sc.value);
        document.querySelectorAll("[data-scyl]").forEach(ch=>ch.setAttribute("aria-pressed", parseFloat(ch.dataset.scyl)===v));
        cost.textContent = v>0 ? `Cost: ${rs(v*state.config.lpgPrice)} at ${rs(state.config.lpgPrice)} per cylinder` : "Enter the number of cylinders."; };
      sc.oninput = upd;
      document.querySelectorAll("[data-scyl]").forEach(ch=>ch.onclick=()=>{ sc.value=ch.dataset.scyl; upd(); });
      $("#startCyl").onclick = () => {
        const v=parseFloat(sc.value); if(!(v>0)) return toast("Enter the number of cylinders.");
        state.open = {id:newId(), startDate:readDT("#sDate"), cyl:v, lpgPrice:state.config.lpgPrice};
        persist(); show("entry", `LPG refill saved. Come back when it runs out.`);
      };
      return;
    }
    const km = $("#fKm"), btn = $("#finishCyl"), pv = $("#fPreview");
    const build = () => { const end=readDT("#fDate");
      return {id:o.id, startDate:o.startDate, date:end, cyl:o.cyl, km:parseFloat(km.value),
              lpgPrice:o.lpgPrice, gasPrice:state.config.gasPrice, kmPerL:state.config.kmPerL, vehicle:vehicleLabel()}; };
    const upd = () => {
      const e = build(), ok = e.km>0;
      btn.disabled = !ok;
      if(!ok){ pv.innerHTML=""; return; }
      const days = daysBetween(e.startDate,e.date);
      pv.innerHTML = `<div class="report">${reportTable(e)}<table>
        <tr><td>Time on this cylinder</td><td>${durText(e.startDate,e.date)}</td></tr>
        ${days>=1?`<tr><td>Average per day</td><td>${num(e.km/days,1)} km</td></tr>`:""}</table></div>`;
    };
    km.oninput = $("#fDate").oninput = upd;
    km.onkeydown = ev => { if(ev.key==="Enter"){ ev.preventDefault(); km.blur(); if(!btn.disabled) btn.click(); } };
    btn.onclick = () => {
      const e = build(); if(!(e.km>0)) return;
      if(new Date(e.date) < new Date(e.startDate)) return toast("The finish date is before the refill date.");
      state.entries.push(e); state.open = null; persist();
      show("summary", `Cylinder finished. ${rs(calc(e).savings)} saved on it.`);
    };
    $("#cancelCyl").onclick = () => {
      if(!confirm("Remove this LPG refill? Use this only if it was entered by mistake.")) return;
      state.open = null; persist(); show("entry","LPG refill removed.");
    };
  },
  manual(){
    const cyl = $("#cyl"), km = $("#km"), btn = $("#saveEntry"), pv = $("#preview");
    const read = () => ({cyl:parseFloat(cyl.value), km:parseFloat(km.value)});
    const upd = () => {
      const v = read(), okC = v.cyl>0, okK = v.km>0;
      btn.disabled = !(okC && okK);
      document.querySelectorAll("[data-cyl]").forEach(ch=>ch.setAttribute("aria-pressed", parseFloat(ch.dataset.cyl)===v.cyl));
      if(okC && okK) pv.innerHTML = `<div class="report">${reportTable({...v, ...pick()})}</div>`;
      else if(okC || okK) pv.innerHTML = `<p class="hint" style="margin-top:12px">Now enter the ${okC?'kilometres travelled':'number of cylinders used'}.</p>`;
      else pv.innerHTML = "";
    };
    cyl.oninput = km.oninput = upd;
    document.querySelectorAll("[data-cyl]").forEach(ch=>ch.onclick=()=>{ cyl.value = ch.dataset.cyl; upd(); km.focus(); });
    cyl.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); km.focus(); } };
    km.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); km.blur(); if(!btn.disabled) btn.click(); } };
    if(desktop()) cyl.focus();
    btn.onclick = () => {
      const v = read(); if(!(v.cyl>0 && v.km>0)) return;
      const e = {id:newId(), date:readDT("#eDate"), ...v, ...pick()};
      state.entries.push(e); persist();
      show("summary", `LPG entry saved. ${rs(calc(e).savings)} saved on this one.`);
    };
  },
  refill(){
    const amt = $("#amt"), btn = $("#saveRefill"), pv = $("#rPreview");
    const upd = () => {
      const a = parseFloat(amt.value), ok = a>0;
      btn.disabled = !ok;
      document.querySelectorAll("[data-amt]").forEach(ch=>ch.setAttribute("aria-pressed", parseFloat(ch.dataset.amt)===a));
      if(!ok){ pv.innerHTML=""; return; }
      const t = totals(), after = t.net - a;
      pv.innerHTML = `<div class="report"><table>
        <tr><td>Gasoline bought (approx.)</td><td>${num(a/state.config.gasPrice)} L</td></tr>
        <tr><td>Enough for about</td><td>${num(a/state.config.gasPrice*state.config.kmPerL,0)} km</td></tr>
        <tr><td>Net total now</td><td class="${cls(t.net)}">${rs(t.net)}</td></tr>
        <tr class="key"><td>Net total after this refill</td><td class="${cls(after)}">${rs(after)}</td></tr>
      </table></div>`;
    };
    amt.oninput = upd;
    document.querySelectorAll("[data-amt]").forEach(ch=>ch.onclick=()=>{ amt.value = ch.dataset.amt; upd(); });
    amt.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); amt.blur(); if(!btn.disabled) btn.click(); } };
    if(desktop()) amt.focus();
    btn.onclick = () => {
      const a = parseFloat(amt.value); if(!(a>0)) return;
      state.refills.push({id:newId(), date:readDT("#rDate"), amount:a, gasPrice:state.config.gasPrice});
      persist(); show("summary", `Gasoline refill of ${rs(a)} saved.`);
    };
  },
  history(){
    document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
      const isLpg = b.dataset.kind==="lpg";
      if(!confirm(isLpg?"Delete this LPG entry?":"Delete this gasoline refill?")) return;
      if(isLpg) state.entries = state.entries.filter(e=>e.id!==b.dataset.id);
      else state.refills = state.refills.filter(r=>r.id!==b.dataset.id);
      persist(); show("history", isLpg?"LPG entry deleted.":"Gasoline refill deleted.");
    });
  },
  prices(){
    $("#savePrices").onclick = () => {
      const l=parseFloat($("#lpgPrice").value), g=parseFloat($("#gasPrice").value), k=parseFloat($("#cylKg").value);
      if(!(l>0&&g>0&&k>0)) return toast("Enter prices and capacity greater than zero.");
      Object.assign(state.config,{lpgPrice:l,gasPrice:g,cylKg:k}); persist(); show("entry","Prices updated.");
    };
  },
  vehicle(){
    $("#saveVehicle").onclick = () => {
      const name=$("#vName").value.trim(), kml=parseFloat($("#kmPerL").value);
      if(!name) return toast("Enter the make and model.");
      if(!(kml>0)) return toast("Enter a consumption greater than zero.");
      Object.assign(state.config,{vehicleName:name, vehicleYear:$("#vYear").value.trim(), vehicleEngine:$("#vEngine").value.trim(), kmPerL:kml});
      persist(); show("entry","Vehicle updated.");
    };
  },
  storage(){
    $("#ghSave").onclick = connectGh;
    $("#ghPull") && ($("#ghPull").onclick = pull);
    $("#ghOff") && ($("#ghOff").onclick = () => { gh=null; try{localStorage.removeItem(LS_GH);}catch(e){}
      setSync("Saved on this device."); show("storage","Disconnected. Records stay on this device."); });
    $("#exportBtn").onclick = () => {
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));
      a.download="lpg-tracker-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
    };
    $("#importFile").onchange = async ev => {
      const f=ev.target.files[0]; if(!f) return;
      try{ const d=JSON.parse(await f.text());
        if(!d.config||!Array.isArray(d.entries)) throw 0;
        const n = normalise(d);
        if(!confirm(`Replace current records with ${n.entries.length} LPG entries and ${n.refills.length} refills from the backup?`)) return;
        state=n; persist(); show("summary","Backup restored.");
      }catch(e){ toast("That file is not a valid tracker backup."); }
      ev.target.value="";
    };
  },
  reset(){
    $("#doReset").onclick = () => {
      if($("#confirmTxt").value.trim().toUpperCase()!=="RESET") return toast("Type RESET in the box to confirm.");
      state = {config:{...DEFAULTS}, entries:[], refills:[], open:null}; persist(); show("entry","All records deleted. Defaults restored.");
    };
  }
};

function $(s){ return document.querySelector(s); }
let toastTimer;
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("on"), 3200); }
function setSync(t){ $("#syncState").textContent = t; }

/* ---------- GitHub storage ---------- */
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
function ghUrl(){ return `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${encodeURIComponent(gh.path).replace(/%2F/g,"/")}`; }
function ghHeaders(){ return {"Authorization":"Bearer "+gh.token, "Accept":"application/vnd.github+json"}; }
async function ghGet(){
  const r = await fetch(ghUrl()+"?ref="+encodeURIComponent(gh.branch)+"&t="+Date.now(), {headers:ghHeaders(), cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error("GitHub said " + r.status + (r.status===401?" (check your token)":""));
  const j = await r.json(); return {sha:j.sha, data:JSON.parse(b64dec(j.content))};
}
async function ghPut(){
  const cur = await ghGet();
  const body = {message:"Update fuel records "+new Date().toISOString(), content:b64enc(JSON.stringify(state,null,2)), branch:gh.branch};
  if(cur && cur.sha) body.sha = cur.sha;
  const r = await fetch(ghUrl(), {method:"PUT", headers:{...ghHeaders(),"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error("GitHub save failed (" + r.status + ")");
}
let pushing = Promise.resolve();
function persist(){
  saveLocal(); refreshPump();
  if(!gh){ setSync("Saved on this device."); return; }
  setSync("Saving to GitHub…");
  pushing = pushing.then(()=>ghPut()).then(()=>setSync("Synced to GitHub at "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+"."))
    .catch(e=>{ setSync("Saved on this device. GitHub sync failed."); toast(e.message+". It will retry on your next change."); });
}
async function pull(){
  if(!gh) return;
  setSync("Loading from GitHub…");
  try{
    const r = await ghGet();
    if(r && r.data && Array.isArray(r.data.entries)){ state = normalise(r.data); saveLocal(); show(current); setSync("Synced with GitHub."); }
    else { await ghPut(); setSync("Synced with GitHub."); }
  }catch(e){ setSync("Saved on this device. GitHub unreachable."); toast("Could not reach GitHub: "+e.message); }
}
async function connectGh(){
  const g = {owner:$("#ghOwner").value.trim(), repo:$("#ghRepo").value.trim(), path:$("#ghPath").value.trim()||"data.json",
             branch:$("#ghBranch").value.trim()||"main", token:$("#ghToken").value.trim()};
  if(!g.owner||!g.repo||!g.token) return toast("Enter your username, repository and token.");
  gh = g; try{ localStorage.setItem(LS_GH, JSON.stringify(gh)); }catch(e){}
  try{ const r = await ghGet();
    const remoteN = r && r.data ? (r.data.entries||[]).length + (r.data.refills||[]).length : 0;
    const localN = state.entries.length + state.refills.length;
    if(remoteN && localN && !confirm(`GitHub already has ${remoteN} records. OK = load them (replaces this device's records). Cancel = upload this device's records instead.`)){
      await ghPut(); setSync("Synced with GitHub."); return show("storage","This device's records uploaded to GitHub.");
    }
    if(r && r.data && Array.isArray(r.data.entries)){ state=normalise(r.data); saveLocal(); setSync("Synced with GitHub."); show("summary","Connected. Records loaded from GitHub."); }
    else { await ghPut(); setSync("Synced with GitHub."); show("storage","Connected. Created "+gh.path+" in your repository."); }
  }catch(e){ toast("Could not connect: "+e.message); }
}

/* ---------- keyboard shortcuts 1–8 on desktop ---------- */
const order=["entry","refill","summary","monthly","history","prices","vehicle","reset"];
document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
  const i=parseInt(e.key,10); if(i>=1&&i<=8) show(order[i-1]);
});

show("entry");
if(gh) pull();
</script>
